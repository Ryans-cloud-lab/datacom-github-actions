name: Datacom First Workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_NAME: WCD Bank Cloud Migration

jobs:
  hello:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: dev
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from ${{ env.PROJECT_NAME }}"

      - name: Show who triggered this
        run: echo "Triggered by $GITHUB_ACTOR on $GITHUB_REPOSITORY in the $ENVIRONMENT environment"

      - name: List the files
        run: ls -la

      - name: Report run details
        run: |
          echo "Run completed on $(date)"
          echo "Run number: $GITHUB_RUN_NUMBER"
          echo "Built by Ryan for the WCD Bank project"